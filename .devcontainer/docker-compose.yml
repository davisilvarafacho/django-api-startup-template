name: django-api-startup-template-devcontainer

x-app-environment: &app-environment
  DJANGO_ENVIRONMENT: development
  DJANGO_DEBUG: "True"
  DJANGO_SECRET_KEY: devcontainer-only-secret
  DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
  DJANGO_CSRF_TRUSTED_ORIGINS: http://127.0.0.1:8000,http://localhost:8000
  DATABASE_NAME: base
  DATABASE_USER: ${DATABASE_USER:-app_web_dev}
  DATABASE_PASSWORD: ${DATABASE_PASSWORD:-app-web-dev-only}
  DATABASE_HOST: db
  DATABASE_PORT: "5432"
  DATABASE_BILLING_MODE: web
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  POSTHOG_ENABLED: "False"
  DJANGO_JSON_LOG_FILE_ENABLED: "True"
  OTEL_ENABLED: "False"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
  # `make run` respeita RUN_HOST/RUN_PORT. Dentro do container o runserver
  # precisa escutar em 0.0.0.0, senão o nginx não alcança o serviço `app`.
  RUN_HOST: 0.0.0.0
  RUN_PORT: "8000"

x-app-build: &app-build
  context: ..
  dockerfile: .devcontainer/Dockerfile

services:
  app:
    build: *app-build
    command: sleep infinity
    environment: *app-environment
    expose:
      - "8000"
    volumes:
      - ..:/workspace:cached
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  billing_ingress:
    build: *app-build
    command: uv run gunicorn api.wsgi:application --bind 0.0.0.0:8002 --workers 1 --reload --error-logfile - --access-logfile -
    environment:
      <<: *app-environment
      DATABASE_BILLING_MODE: ingress
      DATABASE_USER: ${DATABASE_BILLING_INGRESS_USER:-billing_ingress_dev}
      DATABASE_PASSWORD: ${DATABASE_BILLING_INGRESS_PASSWORD:-billing-ingress-dev-only}
      DATABASE_BILLING_MIGRATION_USER: ""
      DATABASE_BILLING_MIGRATION_PASSWORD: ""
    expose:
      - "8002"
    volumes:
      - ..:/workspace:cached
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Mesmo proxy do docker-compose.yml, com o server block de desenvolvimento:
  # a API é sempre acessada por http://localhost:8000 (via nginx), em qualquer
  # ambiente. Suba o runserver com `make run` dentro do container `app`.
  nginx:
    image: nginx:1.29-alpine
    ports:
      - "${NGINX_HOST_PORT:-8000}:80"
    volumes:
      - ../docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../docker/nginx/snippets:/etc/nginx/snippets:ro
      - ../docker/nginx/sites/development:/etc/nginx/conf.d:ro
    depends_on:
      - app
      - billing_ingress
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: base
      POSTGRES_USER: ${DATABASE_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_ADMIN_PASSWORD:-postgres}
      DATABASE_BILLING_WEB_USER: ${DATABASE_USER:-app_web_dev}
      DATABASE_BILLING_WEB_PASSWORD: ${DATABASE_PASSWORD:-app-web-dev-only}
      DATABASE_BILLING_INGRESS_USER: ${DATABASE_BILLING_INGRESS_USER:-billing_ingress_dev}
      DATABASE_BILLING_INGRESS_PASSWORD: ${DATABASE_BILLING_INGRESS_PASSWORD:-billing-ingress-dev-only}
      DATABASE_BILLING_INGRESS_WORKER_USER: ${DATABASE_BILLING_INGRESS_WORKER_USER:-billing_ingress_worker_dev}
      DATABASE_BILLING_INGRESS_WORKER_PASSWORD: ${DATABASE_BILLING_INGRESS_WORKER_PASSWORD:-billing-ingress-worker-dev-only}
    volumes:
      - devcontainer_postgres:/var/lib/postgresql/data
      - ../docker/postgres/init-billing-roles.sh:/docker-entrypoint-initdb.d/10-billing-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_ADMIN_USER:-postgres} -d base"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - devcontainer_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build: *app-build
    command: uv run celery -A api worker -l info -Q celery
    environment: *app-environment
    volumes:
      - ..:/workspace:cached
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  billing_ingress_worker:
    build: *app-build
    command: uv run celery -A api worker -l info -Q billing_ingress
    environment:
      <<: *app-environment
      DATABASE_BILLING_MODE: ingress
      DATABASE_USER: ${DATABASE_BILLING_INGRESS_WORKER_USER:-billing_ingress_worker_dev}
      DATABASE_PASSWORD: ${DATABASE_BILLING_INGRESS_WORKER_PASSWORD:-billing-ingress-worker-dev-only}
      DATABASE_BILLING_INGRESS_USER: ""
      DATABASE_BILLING_INGRESS_PASSWORD: ""
      DATABASE_BILLING_MIGRATION_USER: ""
      DATABASE_BILLING_MIGRATION_PASSWORD: ""
    volumes:
      - ..:/workspace:cached
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  devcontainer_postgres:
  devcontainer_redis:
