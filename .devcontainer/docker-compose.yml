name: drf-base-api-devcontainer

x-app-environment: &app-environment
  DJANGO_ENVIRONMENT: development
  DJANGO_DEBUG: "True"
  DJANGO_SECRET_KEY: devcontainer-only-secret
  DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
  DJANGO_CSRF_TRUSTED_ORIGINS: http://127.0.0.1:8000,http://localhost:8000
  DATABASE_NAME: base
  DATABASE_USER: postgres
  DATABASE_PASSWORD: postgres
  DATABASE_HOST: db
  DATABASE_PORT: "5432"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  POSTHOG_DISABLED: "True"

x-app-build: &app-build
  context: ..
  dockerfile: .devcontainer/Dockerfile

services:
  app:
    build: *app-build
    command: sleep infinity
    environment: *app-environment
    volumes:
      - ..:/workspace:cached
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: base
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - devcontainer_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d base"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - devcontainer_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build: *app-build
    command: uv run celery -A api worker -l info
    environment: *app-environment
    volumes:
      - ..:/workspace:cached
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  devcontainer_postgres:
  devcontainer_redis:
