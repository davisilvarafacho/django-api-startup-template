name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Criar release no GitHub
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
