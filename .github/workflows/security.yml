name: Security

on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # toda segunda, 06:00 UTC
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - name: pip-audit (vulnerabilidades em dependências)
        run: uv run pip-audit || true
      - name: Bandit (SAST)
        run: uv run bandit -r apps api utils -ll || true

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem
        run: docker build -t base-api:ci .
      - name: Trivy (scan da imagem)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: base-api:ci
          severity: HIGH,CRITICAL
          # informativo por enquanto; troque para 1 para bloquear o PR.
          exit-code: "0"
