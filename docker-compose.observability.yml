# Stack de observabilidade: Tempo (traces) + Loki (logs) + Prometheus (métricas) + Grafana (UI).
# Django roda no HOST (runserver/gunicorn) e:
#   - traces   -> exporta OTLP para http://localhost:4318 (Tempo)
#   - métricas -> Prometheus faz scrape em host.docker.internal:8000/metrics
#   - logs     -> escreve em ./logging/*.log; Promtail lê e manda pro Loki
#
# NÃO rode junto com docker-compose.otel.yml (Jaeger) — os dois usam a porta 4318.
#   Subir:  docker compose -f docker-compose.observability.yml up -d
#   Grafana: http://localhost:3000  (login desabilitado, entra direto)
services:
  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"   # API de consulta (Grafana lê daqui)
      - "4318:4318"   # OTLP HTTP  (recebe do Django)
      - "4317:4317"   # OTLP gRPC
    restart: unless-stopped

  loki:
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.2.1
    command: ["-config.file=/etc/promtail/promtail-config.yaml"]
    volumes:
      - ./observability/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - ./logging:/var/log/erp:ro   # lê os *.log que o Django escreve no host
    depends_on:
      - loki
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # alcança o Django rodando no host
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"   # host 3001 (3000 já ocupada pelo Metabase); Grafana interno segue 3000
    depends_on:
      - tempo
      - loki
      - prometheus
    restart: unless-stopped

volumes:
  tempo_data:
  loki_data:
  prometheus_data:
  grafana_data:
