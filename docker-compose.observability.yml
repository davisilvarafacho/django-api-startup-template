# Stack de observabilidade: Tempo (traces) + Loki/Alloy (logs) + Prometheus
# (métricas) + Grafana (UI).
#
# Complementa o docker-compose.yml e entra na rede externa da aplicação para o
# Prometheus alcançar o serviço `web` pelo nome:
#
#   docker compose up -d                                    # app + Postgres + Redis
#   docker compose -f docker-compose.observability.yml up -d # observabilidade
#
# Grafana: http://localhost:3001 (login desabilitado, entra direto)
#
# No host, o Django exporta para http://localhost:4318. No devcontainer, usa
# http://tempo:4318 pela rede externa (ver docs/how-to/observabilidade-local.md).
name: drf-base-api-observability

services:
  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"   # API de consulta (Grafana lê daqui)
      - "4318:4318"   # OTLP HTTP  (recebe do Django)
      - "4317:4317"   # OTLP gRPC
    networks:
      - default
      - application
    restart: unless-stopped

  loki:
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.18.0
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./observability/config.alloy:/etc/alloy/config.alloy:ro
      # LOGGING_ROOT do Django (ver api/settings.py).
      - ./logs:/var/log/drf-base-api:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ${PROMETHEUS_CONFIG:-./observability/prometheus.yml}:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      # Alternativa para quando o Django roda no host (`make run`).
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - application
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      # Destinos do Grafana Alerting (ver observability/grafana/provisioning/alerting/).
      # Os defaults são placeholders válidos: o Grafana sobe e as regras rodam,
      # mas o envio só funciona depois de preencher o `.env`.
      - GRAFANA_DISCORD_WEBHOOK_URL=${GRAFANA_DISCORD_WEBHOOK_URL:-https://discord.com/api/webhooks/0/nao-configurado}
      - GRAFANA_TELEGRAM_BOT_TOKEN=${GRAFANA_TELEGRAM_BOT_TOKEN:-0:nao-configurado}
      - GRAFANA_TELEGRAM_CHAT_ID=${GRAFANA_TELEGRAM_CHAT_ID:-0}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"   # o Grafana interno segue em 3000
    depends_on:
      - tempo
      - loki
      - prometheus
    restart: unless-stopped

volumes:
  tempo_data:
  loki_data:
  prometheus_data:
  grafana_data:
  alloy_data:

networks:
  # Tempo recebe traces e o Prometheus raspa métricas pela rede da aplicação.
  # O devcontainer seleciona drf-base-api-devcontainer_default via Makefile.
  application:
    name: ${APPLICATION_NETWORK:-drf-base-api_default}
    external: true
