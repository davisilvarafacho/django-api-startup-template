# Stack de observabilidade: Tempo (traces) + Loki (logs) + Prometheus (métricas) + Grafana (UI).
#
# Complementa o docker-compose.yml — sobe na MESMA rede, para o Prometheus
# alcançar o serviço `web` pelo nome:
#
#   docker compose up -d                                    # app + Postgres + Redis
#   docker compose -f docker-compose.observability.yml up -d # observabilidade
#
# Grafana: http://localhost:3001 (login desabilitado, entra direto)
#
# O Django precisa de OTEL_ENABLED=1 e OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318
# no .env para exportar traces (ver docs/how-to/observabilidade-local.md).
name: drf-base-api-observability

services:
  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"   # API de consulta (Grafana lê daqui)
      - "4318:4318"   # OTLP HTTP  (recebe do Django)
      - "4317:4317"   # OTLP gRPC
    restart: unless-stopped

  loki:
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.2.1
    command: ["-config.file=/etc/promtail/promtail-config.yaml"]
    volumes:
      - ./observability/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      # LOGGING_ROOT do Django (ver api/settings.py).
      - ./logs:/var/log/drf-base-api:ro
    depends_on:
      - loki
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      # Alternativa para quando o Django roda no host (`make run`).
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"   # 3000 costuma estar ocupada; o Grafana interno segue em 3000
    depends_on:
      - tempo
      - loki
      - prometheus
    restart: unless-stopped

volumes:
  tempo_data:
  loki_data:
  prometheus_data:
  grafana_data:

networks:
  # Mesma rede do docker-compose.yml (name: drf-base-api), para o Prometheus
  # resolver `web`. Suba o compose principal antes deste.
  default:
    name: drf-base-api_default
    external: true
