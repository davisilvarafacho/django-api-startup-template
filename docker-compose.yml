name: django-api-startup-template

x-web-database-environment: &web-database-environment
  DATABASE_NAME: ${DATABASE_NAME:-base}
  DATABASE_USER: ${DATABASE_USER:-app_web}
  DATABASE_PASSWORD: ${DATABASE_PASSWORD:-app-web-dev-only}
  DATABASE_HOST: db
  DATABASE_PORT: "5432"
  BILLING_INGRESS_DATABASE_USER: ""
  BILLING_INGRESS_DATABASE_PASSWORD: ""
  BILLING_INGRESS_WORKER_DATABASE_USER: ""
  BILLING_INGRESS_WORKER_DATABASE_PASSWORD: ""
  BILLING_MIGRATION_DATABASE_USER: ""
  BILLING_MIGRATION_DATABASE_PASSWORD: ""
  POSTGRES_ADMIN_USER: ""
  POSTGRES_ADMIN_PASSWORD: ""

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-base}
      BILLING_WEB_DATABASE_USER: ${DATABASE_USER:-app_web}
      BILLING_WEB_DATABASE_PASSWORD: ${DATABASE_PASSWORD:-app-web-dev-only}
      BILLING_INGRESS_DATABASE_USER: ${BILLING_INGRESS_DATABASE_USER:-billing_ingress_app}
      BILLING_INGRESS_DATABASE_PASSWORD: ${BILLING_INGRESS_DATABASE_PASSWORD:-billing-ingress-dev-only}
      BILLING_INGRESS_WORKER_DATABASE_USER: ${BILLING_INGRESS_WORKER_DATABASE_USER:-billing_ingress_worker}
      BILLING_INGRESS_WORKER_DATABASE_PASSWORD: ${BILLING_INGRESS_WORKER_DATABASE_PASSWORD:-billing-ingress-worker-dev-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-billing-roles.sh:/docker-entrypoint-initdb.d/10-billing-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ${APP_IMAGE:-django-api-startup-template-app:local}
    build: .
    env_file: .env
    # Dentro da rede do compose, os serviços resolvem por nome.
    environment:
      <<: *web-database-environment
      BILLING_DATABASE_MODE: web
      REDIS_HOST: redis
    # Sem `ports`: quem publica a API é o nginx. Expor o gunicorn direto
    # contornaria o proxy — e com ele os headers X-Forwarded-*, a ACL do
    # /metrics e o limite de upload.
    expose:
      - "80"
    volumes:
      # Compartilhados com o nginx, que serve estáticos e mídia do disco.
      - static_files:/app/staticfiles
      - media_files:/app/mediafiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  billing_ingress:
    image: ${APP_IMAGE:-django-api-startup-template-app:local}
    build: .
    env_file: .env
    environment:
      BILLING_DATABASE_MODE: ingress
      DATABASE_NAME: ${DATABASE_NAME:-base}
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_USER: ${BILLING_INGRESS_DATABASE_USER:-billing_ingress_app}
      DATABASE_PASSWORD: ${BILLING_INGRESS_DATABASE_PASSWORD:-billing-ingress-dev-only}
      BILLING_MIGRATION_DATABASE_USER: ""
      BILLING_MIGRATION_DATABASE_PASSWORD: ""
      BILLING_INGRESS_WORKER_DATABASE_USER: ""
      BILLING_INGRESS_WORKER_DATABASE_PASSWORD: ""
      POSTGRES_ADMIN_USER: ""
      POSTGRES_ADMIN_PASSWORD: ""
      REDIS_HOST: redis
    expose:
      - "80"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  mcp:
    profiles: ["mcp"]
    image: ${APP_IMAGE:-django-api-startup-template-app:local}
    build: .
    command:
      - uvicorn
      - apps.api.mcp_server.asgi:create_asgi_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --workers
      - "1"
    env_file: .env
    environment:
      <<: *web-database-environment
      BILLING_DATABASE_MODE: web
      REDIS_HOST: redis
    expose:
      - "8001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8001/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "${NGINX_PORT:-8000}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/snippets:/etc/nginx/snippets:ro
      - ./docker/nginx/sites/production:/etc/nginx/conf.d:ro
      - static_files:/app/staticfiles:ro
      - media_files:/app/mediafiles:ro
    depends_on:
      - web
      - billing_ingress
    healthcheck:
      # /nginx-health responde no próprio nginx: o proxy não fica unhealthy
      # quando o problema está na API.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 5

  uptime_kuma:
    # Interface de monitoramento e alertas. A porta fica restrita ao host;
    # publique-a atrás de HTTPS/VPN se precisar acessá-la remotamente.
    image: louislam/uptime-kuma:2
    ports:
      - "127.0.0.1:${UPTIME_KUMA_PORT:-3002}:3001"
    volumes:
      - uptime_kuma_data:/app/data
    depends_on:
      - nginx
    restart: unless-stopped

  celery_worker:
    image: ${APP_IMAGE:-django-api-startup-template-app:local}
    build: .
    command: celery -A api worker -l info -Q celery
    env_file: .env
    environment:
      <<: *web-database-environment
      BILLING_DATABASE_MODE: web
      REDIS_HOST: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true

  billing_ingress_worker:
    image: ${APP_IMAGE:-django-api-startup-template-app:local}
    build: .
    command: celery -A api worker -l info -Q billing_ingress
    env_file: .env
    environment:
      BILLING_DATABASE_MODE: ingress
      DATABASE_NAME: ${DATABASE_NAME:-base}
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_USER: ${BILLING_INGRESS_WORKER_DATABASE_USER:-billing_ingress_worker}
      DATABASE_PASSWORD: ${BILLING_INGRESS_WORKER_DATABASE_PASSWORD:-billing-ingress-worker-dev-only}
      BILLING_INGRESS_DATABASE_USER: ""
      BILLING_INGRESS_DATABASE_PASSWORD: ""
      BILLING_MIGRATION_DATABASE_USER: ""
      BILLING_MIGRATION_DATABASE_PASSWORD: ""
      POSTGRES_ADMIN_USER: ""
      POSTGRES_ADMIN_PASSWORD: ""
      REDIS_HOST: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true

  celery_beat:
    image: ${APP_IMAGE:-django-api-startup-template-app:local}
    build: .
    command: celery -A api beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    environment:
      <<: *web-database-environment
      BILLING_DATABASE_MODE: web
      REDIS_HOST: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true

volumes:
  postgres_data:
  redis_data:
  static_files:
  media_files:
  uptime_kuma_data:
