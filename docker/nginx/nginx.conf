# Configuração base do nginx, compartilhada por todos os ambientes.
#
# O que muda de um ambiente para o outro é apenas o `server` block. Cada
# ambiente tem um diretório em `sites/`, montado inteiro sobre /etc/nginx/conf.d
# pelo compose correspondente:
#
#   docker-compose.yml               -> sites/production   (upstream gunicorn)
#   .devcontainer/docker-compose.yml -> sites/development  (upstream runserver)
#
# O mount é de diretório, e não de arquivo, de propósito: editor que salva
# trocando o inode (escreve num temporário e renomeia) quebra bind mount de
# arquivo — o container continua vendo o conteúdo antigo até ser recriado.
#
# Valide alterações sem subir a stack com `make nginx-test`; aplique num nginx
# já rodando com `make nginx-reload`.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # A versão do nginx não interessa ao cliente e só ajuda quem procura por
    # versões vulneráveis.
    server_tokens off;

    # DNS interno do Docker: sem isso o nginx resolve os nomes dos serviços uma
    # única vez, na inicialização, e continua batendo no IP antigo depois de um
    # `docker compose restart web`.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ------------------------------------------------------------------
    # WebSocket
    # ------------------------------------------------------------------
    # O handshake do WebSocket exige `Connection: upgrade`, mas mandar esse
    # valor em toda request derrubaria o keepalive com o upstream. O map
    # resolve os dois casos com o mesmo `proxy_set_header`:
    #
    #   com  Upgrade  -> Connection: upgrade  (vira WebSocket)
    #   sem  Upgrade  -> Connection: ""       (mantém a conexão reaproveitável)
    #
    # `Connection: close` no lugar do valor vazio funcionaria, mas fecharia a
    # conexão com o upstream a cada request.
    map $http_upgrade $upstream_connection {
        default upgrade;
        ''      '';
    }

    # ------------------------------------------------------------------
    # Correlation id
    # ------------------------------------------------------------------
    # Reaproveita o `X-Request-ID` do cliente quando ele vem (o middleware em
    # apps/api/core/request_id.py valida e descarta lixo) e, quando não vem,
    # gera o $request_id do nginx — 32 caracteres hex, formato que o middleware
    # aceita. Assim o log do proxy e o log da aplicação usam o mesmo id.
    map $http_x_request_id $correlation_id {
        default $http_x_request_id;
        ''      $request_id;
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rid=$correlation_id rt=$request_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Precisa acompanhar o DATA_UPLOAD_MAX_MEMORY_SIZE/uploads da API: o nginx
    # é quem responde 413 antes de a request chegar no Django.
    client_max_body_size 20M;

    # Compressão
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # Cache de descritores de arquivo (estáticos e mídia)
    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    include /etc/nginx/conf.d/*.conf;
}
