# Ambiente de desenvolvimento (dev container).
#
# Upstream = `manage.py runserver` no serviço `app`, que precisa escutar em
# 0.0.0.0 para o nginx alcançá-lo (RUN_HOST no Makefile já vem 0.0.0.0 dentro do
# dev container).
#
# Diferenças em relação ao production.conf:
#   - estáticos e mídia são servidos pelo próprio runserver, não há alias;
#   - sem buffering, para o autoreload e respostas em streaming aparecerem na
#     hora;
#   - timeouts folgados, para não derrubar a request enquanto o breakpoint do
#     debugger está parado;
#   - /metrics liberado, porque a rede é local e descartável.

upstream api_backend {
    # O runserver não faz keepalive; sem `keepalive` aqui o nginx abre uma
    # conexão por request, que é o que ele espera.
    server app:8000 max_fails=0;
}

server {
    listen 80;
    server_name _;

    include /etc/nginx/snippets/security-headers.conf;

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    location ^~ /health/ {
        access_log off;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://api_backend;
    }

    location ^~ /ws/ {
        include /etc/nginx/snippets/proxy.conf;
        include /etc/nginx/snippets/websocket.conf;
        proxy_pass http://api_backend;
    }

    location / {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://api_backend;

        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_buffering off;
    }
}
