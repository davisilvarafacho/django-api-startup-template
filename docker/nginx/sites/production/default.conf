# Ambiente de produção / stack completa do docker-compose.yml.
#
# Upstream = gunicorn (serviço `web`), estáticos e mídia servidos direto do
# disco pelos volumes `static_files` e `media_files`.

upstream api_backend {
    server web:80 max_fails=3 fail_timeout=30s;

    # Reaproveita conexões com o gunicorn. Só funciona junto do
    # `proxy_http_version 1.1` + `Connection ""` que vêm de snippets/proxy.conf.
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/api_access.log main;
    error_log /var/log/nginx/api_error.log warn;

    include /etc/nginx/snippets/security-headers.conf;

    # Healthcheck do próprio container: responde sem tocar no upstream, então
    # o nginx não fica unhealthy quando é a API que está fora.
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # Arquivos estáticos (collectstatic no build da imagem, volume static_files).
    #
    # O Cache-Control vai só pelo `add_header`: a diretiva `expires` emite o
    # dela por conta própria e a resposta sairia com dois Cache-Control.
    #
    # Uma hora, e não um ano com `immutable`, porque o projeto usa o
    # StaticFilesStorage (api/settings.py) — o nome do arquivo não tem hash,
    # então um CSS alterado mantém a mesma URL e ficaria preso no cache do
    # cliente. Com ManifestStaticFilesStorage, suba para
    # `public, max-age=31536000, immutable`.
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Arquivos de mídia (volume media_files)
    location /media/ {
        alias /app/mediafiles/;
        add_header Cache-Control "public, max-age=604800" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Métricas do Prometheus.
    #
    # A checagem em apps/api/core/metrics.py usa o REMOTE_ADDR — que atrás do
    # proxy é sempre o IP do container do nginx, dentro das faixas internas
    # permitidas. Ou seja: sem esta ACL o /metrics ficaria aberto para quem
    # alcança o proxy. O Prometheus da stack de observabilidade raspa `web:80`
    # direto pela rede do compose e não passa por aqui.
    location = /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        access_log off;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://api_backend;
    }

    # Health/readiness: sem access log para não poluir com o probe do
    # orquestrador (a cada 30s no HEALTHCHECK do Dockerfile).
    location ^~ /health/ {
        access_log off;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://api_backend;
    }

    # WebSocket.
    #
    # O gunicorn com worker `sync` (padrão) NÃO conclui o handshake — a rota
    # existe pronta, mas exige um worker ASGI no upstream. Ver
    # docs/how-to/proxy-nginx.md e GUNICORN_WORKER_CLASS em gunicorn.conf.py.
    location ^~ /ws/ {
        include /etc/nginx/snippets/proxy.conf;
        include /etc/nginx/snippets/websocket.conf;
        proxy_pass http://api_backend;
    }

    location / {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://api_backend;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 16 8k;
        proxy_busy_buffers_size 16k;
    }
}

# HTTPS: termine o TLS aqui apenas quando não houver um load balancer na frente
# fazendo isso. Com um LB, mantenha só o server :80 acima e declare o LB como
# proxy confiável (`set_real_ip_from`, ver snippets/proxy.conf).
#
# server {
#     listen 443 ssl;
#     http2 on;
#     server_name seu-dominio.com;
#
#     ssl_certificate     /etc/nginx/ssl/cert.pem;
#     ssl_certificate_key /etc/nginx/ssl/key.pem;
#     ssl_protocols TLSv1.2 TLSv1.3;
#     ssl_prefer_server_ciphers off;
#     ssl_session_cache shared:SSL:10m;
#     ssl_session_timeout 1d;
#
#     # Repita as locations do server :80 (o $scheme já vai como `https` no
#     # X-Forwarded-Proto, então o Django detecta o TLS sozinho).
# }
