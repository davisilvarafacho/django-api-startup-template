# Headers que o Django precisa para reconstruir a request original.
#
# Todos são *sobrescritos*: o valor que o cliente mandar é descartado. Sem isso
# qualquer um poderia forjar `X-Forwarded-Proto: https` (e passar por
# SECURE_PROXY_SSL_HEADER) ou um IP de origem falso.

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;
proxy_set_header X-Request-ID      $correlation_id;

# Deliberadamente `$remote_addr` e não `$proxy_add_x_forwarded_for`: este nginx
# é a borda, então o header do cliente é sempre suspeito e a lista teria um
# primeiro elemento escolhido por ele — exatamente o valor que
# `apps/api/autenticacao/utils.py::get_client_ip` usa.
#
# Com um load balancer confiável na frente (ALB, Cloudflare), declare-o no
# server block com `set_real_ip_from <cidr>; real_ip_header X-Forwarded-For;` —
# aí o $remote_addr já passa a ser o IP real do cliente e esta linha continua
# correta.
proxy_set_header X-Forwarded-For $remote_addr;

# Upgrade para WebSocket. O `$upstream_connection` (map em nginx.conf) vale
# `upgrade` quando o cliente pede upgrade e vazio no resto do tempo, então
# incluir isto em qualquer location é seguro e mantém o keepalive.
proxy_http_version 1.1;
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $upstream_connection;

proxy_redirect off;
