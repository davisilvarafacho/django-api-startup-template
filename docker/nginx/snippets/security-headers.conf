# Headers de resposta aplicados a tudo que sai pelo proxy.
#
# `always` garante o header também em respostas de erro (4xx/5xx), que é
# justamente quando o Django pode não ter passado pelo middleware de segurança.
#
# Precisa ser repetido dentro de qualquer location que use `add_header`: o nginx
# não herda os headers do nível de cima quando o nível de baixo declara os seus.

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Cross-Origin-Opener-Policy same-origin always;
