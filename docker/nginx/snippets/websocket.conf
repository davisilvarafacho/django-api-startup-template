# Ajustes exclusivos de conexões WebSocket, para a location dedicada.
#
# Os headers de upgrade em si estão em `proxy.conf` (valem em toda location).
# O que não pode valer em toda location são os timeouts longos e a ausência de
# buffering — numa rota HTTP normal eles seguram conexões travadas por uma hora
# e desligam otimização de resposta à toa.

# Um WebSocket fica ocioso entre mensagens; com o read timeout padrão (60s) o
# nginx derrubaria a conexão no primeiro silêncio. Mantenha o keepalive/ping da
# aplicação abaixo deste valor.
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
proxy_connect_timeout 10s;

# Buffering seguraria cada mensagem até encher o buffer — inaceitável num canal
# em tempo real.
proxy_buffering off;
proxy_cache off;
