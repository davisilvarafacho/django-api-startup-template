site_name: DRF Base API
site_description: Base reutilizável para APIs Django REST Framework.
site_url: https://github.com/forteplus/drf-base-api-project
repo_url: https://github.com/forteplus/drf-base-api-project
repo_name: forteplus/drf-base-api-project

theme:
  name: material
  language: pt-BR
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - search.suggest

nav:
  - Início: index.md
  - Tutorial:
      - Primeiro ambiente: tutorial/primeiro-ambiente.md
  - Como fazer:
      - Fluxo de desenvolvimento: how-to/fluxo-de-desenvolvimento.md
      - Desenvolvimento local: how-to/desenvolvimento-local.md
      - Proxy reverso com nginx: how-to/proxy-nginx.md
      - Observabilidade local: how-to/observabilidade-local.md
      - Analytics com PostHog: how-to/analytics-posthog.md
      - Publicar uma versão: how-to/publicar-versao.md
  - Referência:
      - API: reference/api.md
      - Convenções: reference/convencoes.md
      - Frameworks: frameworks.md
      - Roadmap: ROADMAP.md
      - Changelog: CHANGELOG.md
      - Relatório da base: relatorio-base-gente-grande.md
  - Explicações:
      - Arquitetura: explanation/arquitetura.md
      - Autenticação passthrough: explanation/autenticacao.md
  - ADRs:
      - Índice: adr/index.md
      - '0001 — Documentação Diátaxis': adr/0001-documentacao-diataxis.md
      - '0002 — Logs estruturados e retenção': adr/0002-logs-estruturados-e-retencao.md
      - '0003 — Feature flags': adr/0003-feature-flags.md
      - '0004 — Depreciação de API': adr/0004-politica-de-deprecacao-de-api.md
