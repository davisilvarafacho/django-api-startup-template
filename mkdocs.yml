site_name: Django API Startup Template
site_description: Base reutilizável para APIs Django REST Framework.
site_url: https://github.com/davisilvarafacho/django-api-startup-template
repo_url: https://github.com/davisilvarafacho/django-api-startup-template
repo_name: davisilvarafacho/django-api-startup-template

theme:
  name: material
  language: pt-BR
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - search.suggest

# `toc`, `tables` e `fenced_code` são embutidos do MkDocs e continuam ativos.
markdown_extensions:
  - admonition

nav:
  - Início: index.md
  - Tutorial:
      - Primeiro ambiente: tutorial/primeiro-ambiente.md
  - Como fazer:
      - Fluxo de desenvolvimento: how-to/fluxo-de-desenvolvimento.md
      - Resetar migrations: how-to/resetar-migrations.md
      - Desenvolvimento local: how-to/desenvolvimento-local.md
      - Operar assinaturas: how-to/operar-assinaturas.md
      - Proxy reverso com nginx: how-to/proxy-nginx.md
      - Servidor MCP: how-to/usar-servidor-mcp.md
      - Proteção contra força bruta: how-to/protecao-forca-bruta.md
      - Observabilidade local: how-to/observabilidade-local.md
      - Monitoramento e alertas com Uptime Kuma: how-to/uptime-kuma.md
      - Alertas do Grafana no Discord e Telegram: how-to/alertas-grafana.md
      - Analytics com PostHog: how-to/analytics-posthog.md
      - Publicar uma versão: how-to/publicar-versao.md
  - Referência:
      - API: reference/api.md
      - Catálogo de planos: reference/catalogo-de-planos.md
      - Estrutura de diretórios: reference/estrutura-de-diretorios.md
      - Glossário: reference/glossario.md
      - Deprecação de API: reference/deprecacao-api.md
      - Metadata genérico: reference/metadata.md
      - Convenções: reference/convencoes.md
      - Frameworks: frameworks.md
      - Guardrails internos: reference/guardrails.md
      - Roadmap: ROADMAP.md
      - Changelog: CHANGELOG.md
      - Relatório da base: relatorio-base-gente-grande.md
  - Explicações:
      - Arquitetura: explanation/arquitetura.md
      - Autenticação passthrough: explanation/autenticacao.md
  - ADRs:
      - Índice: adr/index.md
      - '0001 — Documentação Diátaxis': adr/0001-documentacao-diataxis.md
      - '0002 — Logs estruturados e retenção': adr/0002-logs-estruturados-e-retencao.md
      - '0003 — Feature flags': adr/0003-feature-flags.md
      - '0004 — Depreciação de API': adr/0004-politica-de-deprecacao-de-api.md
      - '0005 — Cache semântico de autorização': adr/0005-cache-semantico-de-autorizacao.md
      - '0006 — Importações entre módulos': adr/0006-importacoes-entre-modulos.md
      - '0007 — Índices e constraints por organização': adr/0007-indices-e-constraints-por-organizacao.md
      - '0008 — Unicidade por organização': adr/0008-unicidade-por-organizacao.md
      - '0009 — Workspaces como subtenancy': adr/0009-workspaces-como-subtenancy.md
