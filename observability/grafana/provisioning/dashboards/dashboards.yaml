# Carrega os dashboards versionados em observability/grafana/dashboards/.
apiVersion: 1
providers:
  - name: drf-base-api
    orgId: 1
    folder: DRF Base API
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
