# Carrega os dashboards versionados em observability/grafana/dashboards/.
apiVersion: 1
providers:
  - name: django-api-startup-template
    orgId: 1
    folder: Django API Startup Template
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
