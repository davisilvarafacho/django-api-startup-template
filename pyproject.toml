[project]
name = "drf-base-api-project"
version = "0.1.0"
description = "Projeto base para APIs Django REST Framework."
requires-python = ">=3.10"
dependencies = [
    "annotated-types==0.7.0",
    "anyio==4.11.0",
    "asgiref==3.10.0",
    "b2sdk==2.12.0",
    "bleach==6.3.0",
    "celery>=5.6.3",
    "certifi==2025.11.12",
    "charset-normalizer==3.4.4",
    "diff-match-patch==20241021",
    "django==5.2.8",
    "django-auditlog==3.3.0",
    "django-axes==8.0.0",
    "django-cachalot==2.8.0",
    "django-celery-beat>=2.9.0",
    "django-cors-headers==4.9.0",
    "django-dbbackup==5.0.1",
    "django-filter==25.2",
    "django-guardian>=3.3.2",
    "django-hijack==3.7.4",
    "django-import-export==4.3.14",
    "django-prometheus>=2.5.0",
    "django-redis>=7.0.0",
    "django-rest-knox==5.0.2",
    "django-rls>=2.0.0",
    "django-scalar==0.2.0",
    "django-threadlocals==0.10",
    "django-unfold==0.81.0",
    "django-waffle>=5.0.0",
    "djangorestframework==3.16.1",
    "drf-spectacular==0.30.0",
    "exceptiongroup==1.3.0",
    "gprof2dot==2025.4.14",
    "gunicorn==26.0.0",
    "h11==0.16.0",
    "hiredis>=3.4.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.11",
    "iniconfig==2.3.0",
    "logfury==1.0.1",
    "markupsafe==3.0.3",
    "packaging==25.0",
    "pillow==12.0.0",
    "pluggy==1.6.0",
    "posthog>=7.28.0",
    "psycopg2-binary==2.9.11",
    "pygments==2.19.2",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.2.2",
    "python-json-logger>=4.1.0",
    "pyyaml==6.0.3",
    "redis>=8.0.1",
    "requests==2.32.5",
    "resend==2.34.0",
    "rules>=3.5",
    "sentry-sdk==2.66.1",
    "serpy==0.3.1",
    "six==1.17.0",
    "sniffio==1.3.1",
    "sqlparse==0.5.3",
    "tablib==3.9.0",
    "tomli==2.3.0",
    "typing-extensions==4.15.0",
    "tzdata==2025.2",
    "ua-parser==1.0.1",
    "ua-parser-builtins==0.18.0.post1",
    "urllib3==2.5.0",
    "user-agents==2.2.0",
    "webencodings==0.5.1",
    "werkzeug==3.1.3",
]

[tool.django-stubs]
django_settings_module = "api.settings"

[tool.mypy]
allow_untyped_globals = true
allow_redefinition = true
check_untyped_defs = true
ignore_missing_imports = true
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
show_traceback = true
warn_redundant_casts = true
warn_unused_ignores = true

plugins = [
  "mypy_django_plugin.main"
]

exclude = [
  "tests/"
]

  [[tool.mypy.overrides]]
  module = ["apps.*.migrations.*"]
  ignore_errors = true

[tool.ruff]
target-version = "py312"
line-length = 150
extend-exclude = ["*/migrations/*", "libs", "examples"]

  [tool.ruff.lint]
  select = [
    "ASYNC",
    "B",
    "C4",
    "D",
    "DTZ",
    "E",
    "F",
    "FURB",
    "G",
    "I",
    "ISC001",
    "ISC002",
    "LOG",
    "PGH",
    "PIE",
    "PT",
    "PYI",
    "RET",
    "T20",
    "UP",
    "W"
  ]
  ignore = [
    "F403", # 'from module import *' used; unable to detect undefined names
    # "B009", # Do not call getattr with a constant value
    # "B010", # Do not call setattr with a constant value
    # "B023", # Function definition does not bind loop variable
    "D100", # Missing docstring in public module
    "D101", # Missing docstring in public class
    "D102", # Missing docstring in public method
    "D103", # Missing docstring in public function
    "D104", # Missing docstring in public package
    "D105", # Missing docstring in magic method
    "D106", # Missing docstring in public nested class
    "D107", # Missing docstring in __init__
    "D202", # No blank lines allowed after function docstring
    # "D203", # 1 blank line required before class docstring
    # "D206", # Docstring should be indented with spaces, not tabs
    # "D213", # Multi-line docstring summary should start at the second line
    "D401", # First line should be in imperative mood
    "D415", # First line should end with a period, question mark, or exclamation point
    # "D407", # Missing dashed underline after section
    # "E501", # Line too long
    # "PT019", # Fixture without value is injected as parameter, use @pytest.mark.usefixtures instead
    # "PYI041", # Use `float` instead of `int | float`
    # "RET504", # Unnecessary assignment before return statement
    # "PGH003",  # Unnecessary error/warning ignore
    # "PIE790"  # Unnecessary pass
  ]

  [tool.ruff.lint.isort.sections]
  django = ["django"]
  rest-framework = ["rest_framework"]

  [tool.ruff.lint.isort]
  known-first-party = ["apps"]
  section-order = [
    "future",
    "standard-library",
    "django",
    "rest-framework",
    "third-party",
    "first-party",
    "local-folder",
  ]

  [tool.ruff.lint.pydocstyle]
  convention = "google"

  [tool.ruff.lint.per-file-ignores]
  # Testes legados em estilo unittest.
  "apps/api/core/tests/test_b2_storage.py" = ["PT009", "PT027"]
  "apps/api/core/tests/test_email_backends.py" = ["PT009", "PT027"]
  # Scripts de linha de comando se comunicam pelo stdout.
  "scripts/*" = ["T201"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "api.settings"
python_files = ["test_*.py", "*_test.py", "testing/python/*.py"]
# O projeto de referência em examples/ tem a própria suíte e os próprios módulos;
# coletá-la aqui só gera ModuleNotFoundError.
norecursedirs = ["examples", ".git", ".venv", "node_modules", "site", "staticfiles"]
addopts = "--cov --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["apps", "api", "utils"]
omit = [
  "*/migrations/*",
  "*/tests/*",
  "manage.py",
  "api/wsgi.py",
  "api/asgi.py",
  "api/celery.py",
]

[tool.coverage.report]
show_missing = true
# Gate local de cobertura. Suba conforme a suíte cresce (o gate por PR fica no Codecov).
fail_under = 0

[dependency-groups]
test = [
    "factory-boy>=3.3.3",
    "faker==40.35.0",
    "pytest==9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django==4.12.0",
]
dev = [
    { include-group = "test" },
    "bandit>=1.9.4",
    "commitizen>=4.13.9",
    "django-stubs>=6.0.7",
    "django-cprofile-middleware==1.0.5",
    "django-debug-toolbar==6.1.0",
    "django-extensions==4.1",
    "django-silk==5.4.3",
    "django-zeal==2.0.4",
    "drf-api-logger==1.1.21",
    "mypy>=2.3.0",
    "mkdocs-material>=9.7.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.1",
    "ruff>=0.15.22",
]
observability = [
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-instrumentation-celery>=0.65b0",
    "opentelemetry-instrumentation-django>=0.65b0",
    "opentelemetry-instrumentation-psycopg2>=0.65b0",
    "opentelemetry-instrumentation-redis>=0.65b0",
    "opentelemetry-instrumentation-requests>=0.65b0",
    "opentelemetry-sdk>=1.44.0",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"          # fonte da verdade = [project] version
tag_format = "v$version"
version_scheme = "semver"
major_version_zero = true            # em 0.x, breaking change vira minor (não 1.0.0)
update_changelog_on_bump = true
changelog_incremental = true
# Arquivos extra onde a versão é espelhada (pyproject é tratado pelo provider pep621).
version_files = [
    "api/settings.py:\"VERSION\"",
]
